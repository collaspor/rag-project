# 评测数据目录。目录下应包含 split 对应的 jsonl 文件，例如 test_2.jsonl。
dataset_path: /root/autodl-tmp/hw-chat/hw-chat-0.3/hwrag/data/test

# FAISS 向量索引文件路径，用于稠密向量检索。
index_path: /root/autodl-tmp/hw-chat/hw-chat-0.3/knowledge_base/wiki/vector_store/bge-large-zh-v1.5/index.faiss

# 检索语料文件路径。通常是构建索引时使用的原始 chunk 数据。
corpus_path: /root/autodl-tmp/hw-chat/hw-chat-0.3/hwrag/data/indexes/education.jsonl

# 检索模型路径。这里使用中文向量模型 BGE。
retrieval_model_path: /root/autodl-tmp/data/BAAI/bge-large-zh-v1.5

# 检索缓存目录。开启缓存后，可复用 query 的召回结果以减少重复计算。
retrieval_cache_path: /root/autodl-tmp/hw-chat/hw-chat-0.3/hwrag/data/cache

# 生成模型名称，用于框架内部分支判断或日志标识。
generator_model: chatglm3-6b

# 生成模型本地路径。
generator_model_path: /root/autodl-tmp/data/ZhipuAI/chatglm3-6b

# 结果输出根目录。pipeline 会自动创建时间戳子目录，并保存指标、过程数据和配置快照。
save_dir: /root/autodl-tmp/hw-chat/hw-chat-0.3/hwrag/data/result

# 数据集名称，仅用于结果目录命名和评测标识。
dataset_name: test_3

# 要加载并运行的 split 列表。文件名需与 split 名称一致，例如 test_3 -> test_3.jsonl。
split:
  - test_3

# 测试采样数量。设为 0 或不小于数据总量时，可视为跑完整数据集。
test_sample_num: 88

# 是否随机采样测试集。false 表示按文件顺序取样。
random_sample: false

# 检索方式。非 bm25 时会走 DenseRetriever。
retrieval_method: bge-large-zh-v1

# 初始召回 top-k 数量。
retrieval_topk: 5

# 是否将本次召回结果写入缓存。
save_retrieval_cache: false

# 是否优先读取历史检索缓存。
use_retrieval_cache: false

# 是否启用 reranker 重排序。当前可先关闭，待模型下载完成后再开启。
use_reranker: false

# reranker 模型路径。启用 reranker 时必须保证该目录存在且包含模型配置文件。
rerank_model_path: /root/autodl-tmp/data/Xorbits/bge-reranker-large

# reranker 模型名称，用于日志或模型分支判断。
rerank_model_name: bge-reranker-large

# 重排序后保留的 top-k 数量。
rerank_topk: 3

# reranker 单次输入最大长度。
rerank_max_length: 512

# reranker 推理批大小。
rerank_batch_size: 2

# 是否对 reranker 启用 FP16 半精度推理。
rerank_use_fp16: true

# 是否使用 GPU 版 FAISS 索引搜索。
faiss_gpu: false

# 是否通过 sentence-transformers 接口加载向量模型。
use_sentence_transformer: false

# 向量池化方式，常见值为 mean 或 cls。
retrieval_pooling_method: mean

# 向量检索编码批大小。
retrieval_batch_size: 12

# 检索 query 的最大 token 长度。
retrieval_query_max_length: 128

# 是否对检索向量模型启用 FP16。
retrieval_use_fp16: true

# 送入生成模型前的最大输入长度。
generator_max_input_len: 2048

# 生成阶段批大小。
generator_batch_size: 2

# 生成参数。
generation_params:
  # 是否使用采样生成。false 更适合评测阶段的稳定输出。
  do_sample: false
  # 单次生成允许输出的最大 token 数。
  max_tokens: 1024

# 推理设备。通常为 cuda 或 cpu。
device: cuda

# 是否保存最终汇总指标到 metric_score.txt。
save_metric_score: true

# 是否保存中间结果，例如每条样本的检索、prompt、预测和分项分数。
save_intermediate_data: true

# 当前启用的评测指标列表。
metrics:
  - em
  - sub_em
  - f1
  - precision
  - recall
  - rouge-l
  - retrieval_recall
  - retrieval_precision
  - hit@1
  - hit@3
  - hit@5
  - mrr

# 评测指标附加配置。
metric_setting:
  # 检索指标统计时使用的 top-k。
  retrieval_recall_topk: 3
  retrieval_precision_topk: 3
  hit_topk_1: 1
  hit_topk_3: 3
  hit_topk_5: 5
  mrr_topk: 5
  retrieval_match_threshold: 0.6

# 生成框架类型。fschat 表示通过 FastChat 接入模型。
framework: fschat

# Prompt 模板配置。
prompt_template:
  # 评估场景下优先控制回答长度和表达方式，减少发散输出。
  system_prompt: |
    你是一个用于离线评估的知识库问答助手。
    请严格根据给定参考文档回答，不要使用参考文档之外的知识。
    如果参考文档不能直接支持答案，请只回答“未找到答案”。
    只输出最终答案，不要输出分析过程、背景解释、补充说明或引用提示语。
    答案尽量精炼，优先控制在1句；必要时最多2句。
    对于定义类、事实类、概念类问题，优先直接给出最核心结论。
    下面是给定的参考文档：
    {reference}

  # 用户提示词进一步约束输出格式，提升 EM/F1 友好度。
  user_prompt: |
    问题: {question}
    要求:
    1. 只回答问题核心结论。
    2. 不要复述题目。
    3. 不要输出与问题无关的信息。
    4. 若文档中没有明确答案，直接回答“未找到答案”。
    5. 优先输出最短但完整的答案。
    答案:
